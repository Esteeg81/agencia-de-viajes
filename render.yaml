services:
  - type: web
    name: agencia-de-viajes
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm install --prefix server
    startCommand: NODE_ENV=production ./server/node_modules/.bin/tsx server/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERPAPI_KEY
        sync: false
